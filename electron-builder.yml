appId: com.fivecommunity.fivemaplocator
productName: Five Map Locator
copyright: Copyright © 2026 FiveCommunity

directories:
  output: release
  buildResources: assets

npmRebuild: false
afterPack: ./apps/electron/scripts/after-pack.cjs

files:
  - "apps/electron/dist/**/*"
  - "package.json"

extraResources:
  - from: apps/electron/web
    to: web
    filter:
      - "**/*"
  - from: assets/icon.ico
    to: icon.ico

win:
  icon: assets/icon.ico
  signAndEditExecutable: true
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: "Five Map Locator.exe"
